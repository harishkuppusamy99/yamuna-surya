<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surya Weds Yamuna</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(230, 57, 70, 0.2);
            max-width: 450px;
            width: 100%;
            border: 2px solid #ffb6c1;
            position: relative;
        }

        .heart-icon {
            font-size: 2.5rem;
            color: #ff4b2b;
            animation: pulse 1.5s infinite;
            display: inline-block;
            margin-bottom: 10px;
        }

        h1 {
            color: #d63384;
            font-size: 2.2rem;
            margin-bottom: 10px;
            font-family: 'Georgia', serif;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .subtitle {
            color: #6c757d;
            font-size: 1rem;
            margin-bottom: 25px;
        }

        .audio-wrapper {
            background: #fff0f3;
            padding: 15px;
            border-radius: 50px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid #ffccd5;
        }

        audio {
            width: 100%;
            outline: none;
        }

        .hearts-bg {
            margin-top: 20px;
            font-size: 1.2rem;
            letter-spacing: 8px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.18); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="heart-icon">💖</div>
        <h1>Surya Weds Yamuna</h1>
        <p class="subtitle">Press play to listen 💕</p>

        <div class="audio-wrapper">
            <audio controls>
                <source src="song.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>

        <div class="hearts-bg">
            ❤️ 💕 💖 💗 💓
        </div>
    </div>

</body>
</html>
