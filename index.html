<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Happy Married Life ❤️</title>


<style>

/* =========================
   BASIC
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    overflow: hidden;
    height: 100vh;
    font-family: Arial, sans-serif;
}


/* =========================
   FIREWORK CANVAS
========================= */

#fireworks {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
}


/* =========================
   TITLE
========================= */

.title {

    position: fixed;

    top: 25px;

    left: 50%;

    transform: translateX(-50%);

    width: 100%;

    text-align: center;

    z-index: 10;

    color: #ffd700;

    /* FONT CHANGED ONLY */
    font-family:
        "Georgia",
        "Times New Roman",
        serif;

    font-size: clamp(
        28px,
        6vw,
        65px
    );

    font-weight: bold;

    letter-spacing: 3px;

    white-space: nowrap;

    /* NO SHAKE */

    text-shadow:

        0 0 5px #ffffff,

        0 0 10px #ffd700,

        0 0 20px #ffd700,

        0 0 35px #ff9800,

        0 0 50px #ff6f00;
}


/* =========================
   VIDEO BOX
========================= */

.video-box {

    position: fixed;

    top: 50%;

    left: 50%;

    transform:
        translate(-50%, -50%);

    width: 90%;

    max-width: 900px;

    z-index: 5;
}


/* =========================
   VIDEO
========================= */

.video-box video {

    width: 100%;

    height: auto;

    display: block;

    border-radius: 15px;

    background: #000;

    box-shadow:

        0 0 15px #fff,

        0 0 30px
        rgba(255,255,255,0.7),

        0 0 50px
        rgba(255,215,0,0.4);
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .title {

        top: 35px;

        font-size: 22px;

        letter-spacing: 1px;
    }

    .video-box {

        width: 90%;
    }

    .video-box video {

        border-radius: 12px;
    }
}

</style>

</head>


<body>


<!-- =========================
     FIREWORK CANVAS
========================= -->

<canvas id="fireworks"></canvas>


<!-- =========================
     TITLE
========================= -->

<div class="title">

    ❤️ HAPPY MARRIED LIFE ❤️

</div>


<!-- =========================
     VIDEO
========================= -->

<div class="video-box">

    <video
        controls
        autoplay
        loop
        muted
        playsinline>

        <source
            src="dance1.mp4"
            type="video/mp4">

        Your browser does not support video.

    </video>

</div>



<script>


/* =========================
   CANVAS
========================= */

const canvas =
    document.getElementById("fireworks");

const ctx =
    canvas.getContext("2d");

let W;
let H;


function resize() {

    W =
        canvas.width =
        window.innerWidth;

    H =
        canvas.height =
        window.innerHeight;
}

resize();

window.addEventListener(
    "resize",
    resize
);



/* =========================
   COLORS
========================= */

const colors = [

    "#ffd700",

    "#ff1744",

    "#ff4081",

    "#00e5ff",

    "#76ff03",

    "#ffffff",

    "#ff9100"

];



/* =========================
   ARRAYS
========================= */

let rockets = [];

let particles = [];

let hearts = [];



/* =========================
   LAUNCH ROCKET
========================= */

function launchRocket() {

    let x;

    if (Math.random() < 0.5) {

        x =
            Math.random()
            * W
            * 0.20;

    }

    else {

        x =
            W -
            Math.random()
            * W
            * 0.20;
    }


    rockets.push({

        x: x,

        y: H + 20,

        vx:
            (Math.random() - 0.5)
            * 0.7,

        vy:
            -(Math.random() * 6 + 10),

        targetY:
            H * 0.12 +
            Math.random() * 80,

        color:
            colors[
                Math.floor(
                    Math.random()
                    * colors.length
                )
            ],

        trail: []

    });

}



/* =========================
   CREATE HEART
========================= */

function createHeart(
    x = Math.random() * W,
    y = H + 20
) {

    hearts.push({

        x: x,

        y: y,

        size:
            Math.random() * 10 + 8,

        speed:
            Math.random() * 1.5 + 0.8,

        drift:
            (Math.random() - 0.5)
            * 0.8,

        life:
            180 +
            Math.random() * 100,

        color:
            Math.random() > 0.5
            ? "#ff1744"
            : "#ff4081"

    });

}



/* =========================
   FIREWORK EXPLOSION
========================= */

function explode(
    x,
    y,
    color
) {


    /* MAIN PARTICLES */

    for (
        let i = 0;
        i < 130;
        i++
    ) {

        const angle =
            Math.random()
            * Math.PI
            * 2;

        const speed =
            Math.random() * 5 + 2;


        particles.push({

            x: x,

            y: y,

            vx:
                Math.cos(angle)
                * speed,

            vy:
                Math.sin(angle)
                * speed,

            gravity: 0.045,

            life:
                110 +
                Math.random() * 70,

            maxLife: 180,

            size:
                Math.random()
                * 2.5 + 1,

            color: color

        });

    }



    /* WHITE FLASH */

    for (
        let i = 0;
        i < 35;
        i++
    ) {

        const angle =
            Math.random()
            * Math.PI
            * 2;

        const speed =
            Math.random() * 3;


        particles.push({

            x: x,

            y: y,

            vx:
                Math.cos(angle)
                * speed,

            vy:
                Math.sin(angle)
                * speed,

            gravity: 0.01,

            life: 35,

            maxLife: 35,

            size: 3,

            color: "#ffffff"

        });

    }



    /* HEARTS FROM FIREWORK */

    for (
        let i = 0;
        i < 12;
        i++
    ) {

        createHeart(

            x +
            (Math.random() - 0.5)
            * 100,

            y +
            (Math.random() - 0.5)
            * 100

        );

    }

}



/* =========================
   DRAW ROCKET
========================= */

function drawRocket(r) {


    /* TRAIL */

    for (
        let i = 0;
        i < r.trail.length;
        i++
    ) {

        const t =
            r.trail[i];


        ctx.beginPath();

        ctx.arc(

            t.x,

            t.y,

            1.5,

            0,

            Math.PI * 2

        );


        ctx.fillStyle =
            `rgba(
                255,
                190,
                50,
                ${i / r.trail.length}
            )`;


        ctx.shadowBlur = 15;

        ctx.shadowColor =
            "#ff9800";


        ctx.fill();

    }



    /* ROCKET HEAD */

    ctx.beginPath();

    ctx.arc(

        r.x,

        r.y,

        3,

        0,

        Math.PI * 2

    );


    ctx.fillStyle =
        "#ffffff";


    ctx.shadowBlur = 25;

    ctx.shadowColor =
        r.color;


    ctx.fill();

}



/* =========================
   UPDATE ROCKETS
========================= */

function updateRockets() {

    for (
        let i = rockets.length - 1;
        i >= 0;
        i--
    ) {

        const r =
            rockets[i];


        r.trail.push({

            x: r.x,

            y: r.y

        });


        if (
            r.trail.length > 22
        ) {

            r.trail.shift();

        }


        r.x += r.vx;

        r.y += r.vy;

        r.vy += 0.08;


        if (

            r.y <= r.targetY ||

            r.vy >= 0

        ) {

            explode(

                r.x,

                r.y,

                r.color

            );


            rockets.splice(
                i,
                1
            );

        }

    }

}



/* =========================
   UPDATE PARTICLES
========================= */

function updateParticles() {

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];


        p.x += p.vx;

        p.y += p.vy;

        p.vy += p.gravity;

        p.vx *= 0.985;

        p.vy *= 0.985;

        p.life--;


        if (
            p.life <= 0
        ) {

            particles.splice(
                i,
                1
            );

        }

    }

}



/* =========================
   DRAW PARTICLES
========================= */

function drawParticles() {

    for (
        const p of particles
    ) {

        const alpha =
            Math.max(

                p.life /
                p.maxLife,

                0

            );


        ctx.globalAlpha =
            alpha;


        ctx.beginPath();

        ctx.arc(

            p.x,

            p.y,

            p.size,

            0,

            Math.PI * 2

        );


        ctx.fillStyle =
            p.color;


        ctx.shadowBlur = 18;

        ctx.shadowColor =
            p.color;


        ctx.fill();

    }


    ctx.globalAlpha = 1;

}



/* =========================
   DRAW HEART
========================= */

function drawHeart(
    x,
    y,
    size,
    color,
    alpha
) {

    ctx.save();

    ctx.globalAlpha =
        alpha;

    ctx.fillStyle =
        color;

    ctx.shadowBlur = 20;

    ctx.shadowColor =
        color;


    ctx.beginPath();


    ctx.moveTo(
        x,
        y + size * 0.3
    );


    ctx.bezierCurveTo(

        x - size,
        y - size * 0.2,

        x - size,
        y + size * 0.7,

        x,
        y + size

    );


    ctx.bezierCurveTo(

        x + size,
        y + size * 0.7,

        x + size,
        y - size * 0.2,

        x,
        y + size * 0.3

    );


    ctx.fill();

    ctx.restore();

}



/* =========================
   UPDATE HEARTS
========================= */

function updateHearts() {

    for (
        let i = hearts.length - 1;
        i >= 0;
        i--
    ) {

        const h =
            hearts[i];


        h.y -= h.speed;

        h.x += h.drift;

        h.life--;


        if (

            h.life <= 0 ||

            h.y < -30

        ) {

            hearts.splice(
                i,
                1
            );

        }

    }

}



/* =========================
   DRAW HEARTS
========================= */

function drawHearts() {

    for (
        const h of hearts
    ) {

        const alpha =
            Math.min(
                h.life / 80,
                1
            );


        drawHeart(

            h.x,

            h.y,

            h.size,

            h.color,

            alpha

        );

    }

}



/* =========================
   CONTINUOUS HEARTS
========================= */

setInterval(

    () => {

        createHeart();

    },

    220

);



/* =========================
   ANIMATION
========================= */

function animate() {

    ctx.clearRect(

        0,

        0,

        W,

        H

    );


    updateRockets();

    updateParticles();

    updateHearts();


    for (
        const r of rockets
    ) {

        drawRocket(r);

    }


    drawParticles();

    drawHearts();


    requestAnimationFrame(
        animate
    );

}



/* =========================
   START FIREWORKS
========================= */

setTimeout(
    () => launchRocket(),
    300
);

setTimeout(
    () => launchRocket(),
    900
);

setTimeout(
    () => launchRocket(),
    1500
);

setTimeout(
    () => launchRocket(),
    2200
);


/* CONTINUOUS FIREWORKS */

setInterval(

    () => {

        launchRocket();

    },

    1300

);


/* START */

animate();

</script>


</body>

</html>
