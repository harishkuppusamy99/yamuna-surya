<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Music Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f2f2f2;
            margin-top: 100px;
        }

        .music-box {
            background-color: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px gray;
        }

        h1 {
            color: #333;
        }

        button {
            background-color: #333;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="music-box">

        <h1>🎵 My Music Page</h1>

        <p>Listen to my favorite song</p>

        <audio id="music" controls autoplay muted>
            <source src="song.mp3" type="audio/mp3">
            Your browser does not support the audio element.
        </audio>

        <br>

        <button onclick="startMusic()">🔊 Play Music</button>

    </div>

    <script>
        function startMusic() {
            var music = document.getElementById("music");

            music.muted = false;
            music.play();
        }
    </script>

</body>

</html>
